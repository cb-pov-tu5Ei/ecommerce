<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Ecommerce</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
</head>
<body>
    <div class="container my-5">
        <h1>Change Password</h1>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/user/change-password}" method="post">
            <div class="mb-3">
                <label for="userId" class="form-label">User ID</label>
                <input type="text" id="userId" name="userId" class="form-control">
            </div>
            <div class="mb-3">
                <label for="oldPassword" class="form-label">Current Password</label>
                <input type="password" id="oldPassword" name="currentPassword" class="form-control">
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control">
            </div>
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Change Password</button>
            <a th:href="@{/user/profile}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>
</html>
