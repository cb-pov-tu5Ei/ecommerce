<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Ecommerce</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Ecommerce</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" th:href="@{/products}">Products</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Cart</a></li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" th:href="@{/orders/history}">My Orders</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="nav-link">Hello, <span sec:authentication="name">User</span></span>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link">Logout</button>
                        </form>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/login}">Login</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" th:href="@{/register}">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <!-- Search and Filter -->
        <div class="row mb-4">
            <div class="col-md-4">
                <form th:action="@{/products/search}" method="get" class="mb-3">
                    <div class="input-group">
                        <input type="text" name="query" class="form-control" placeholder="Search products..."
                               th:value="${searchQuery}">
                        <button class="btn btn-primary" type="submit">Search</button>
                    </div>
                </form>

                <h5>Categories</h5>
                <div class="list-group">
                    <a th:href="@{/products}" class="list-group-item list-group-item-action"
                       th:classappend="${selectedCategoryId == null ? 'active' : ''}">
                        All Products
                    </a>
                    <a th:each="category : ${categories}"
                       th:href="@{/products/category/{id}(id=${category.id})}"
                       th:text="${category.name}"
                       class="list-group-item list-group-item-action"
                       th:classappend="${selectedCategoryId == category.id ? 'active' : ''}">
                        Category
                    </a>
                </div>
            </div>

            <div class="col-md-8">
                <h2>Products</h2>
                <p th:if="${searchQuery}" class="text-muted">
                    Showing results for "<span th:text="${searchQuery}"></span>"
                </p>

                <div class="row">
                    <div class="col-md-6 col-lg-4 mb-4" th:each="product : ${products}">
                        <div class="card h-100">
                            <img th:src="${product.imageUrl}" class="card-img-top" th:alt="${product.name}"
                                 style="height: 200px; object-fit: cover;">
                            <div class="card-body">
                                <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                                <p class="card-text text-muted" th:text="${#strings.abbreviate(product.description, 80)}">
                                    Description
                                </p>
                                <p class="card-text">
                                    <strong th:text="${'$' + product.price}">$0.00</strong>
                                </p>
                                <p class="text-muted" th:text="${product.stockQuantity > 0 ? 'In Stock' : 'Out of Stock'}"></p>
                            </div>
                            <div class="card-footer">
                                <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary btn-sm w-100">
                                    View Details
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/products(page=${currentPage - 1})}">
                                Previous
                            </a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage ? 'active' : ''}">
                            <a class="page-link" th:href="@{/products(page=${i})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == (totalPages - 1) ? 'disabled' : ''}">
                            <a class="page-link" th:href="@{/products(page=${currentPage + 1})}">
                                Next
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container text-center">
            <p>&copy; 2026 Ecommerce Demo. All rights reserved.</p>
        </div>
    </footer>

    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
