apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Repo access test

on:
  push:
    branches:
      - '**'

jobs:
  test-checkout:
    steps:
      - name: Checkout
        uses: cloudbees-io/checkout@v2

      - name: Verify repo contents
        uses: docker://alpine:3.20
        shell: sh
        run: |
          pwd
          ls -la
