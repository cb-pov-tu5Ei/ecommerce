apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: dummy-orchestrator

on:
  workflow_dispatch:
    inputs:
      artifact-version:
        type: string
        required: true

      target-environment:
        type: string
        required: true

      deployment-region:
        type: string
        required: true

      enable-maintenance-mode:
        type: boolean
        required: false

      deployment-strategy:
        type: string
        required: true

jobs:
  validate-inputs:
    steps:
      - name: Print deployment inputs
        uses: docker://alpine:latest
        run: |
          echo "================================="
          echo "Starting orchestration test"
          echo "================================="
          echo "Artifact Version: ${{ inputs.artifact-version }}"
          echo "Target Environment: ${{ inputs.target-environment }}"
          echo "Deployment Region: ${{ inputs.deployment-region }}"
          echo "Maintenance Mode: ${{ inputs.enable-maintenance-mode }}"
          echo "Deployment Strategy: ${{ inputs.deployment-strategy }}"
          echo "================================="

  simulate-deployment:
    needs: validate-inputs
    environment: ${{ inputs.target-environment }}
    steps:
      - name: Simulate deployment execution
        uses: docker://alpine:latest
        run: |
          echo "Starting simulated deployment..."
          sleep 15
          echo "Deployment completed successfully"

  publish-evidence:
    needs: simulate-deployment
    steps:
      - name: Publish evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Dummy Deployment Completed

            Artifact Version: ${{ inputs.artifact-version }}

            Target Environment: ${{ inputs.target-environment }}

            Deployment Region: ${{ inputs.deployment-region }}

            Maintenance Mode: ${{ inputs.enable-maintenance-mode }}

            Deployment Strategy: ${{ inputs.deployment-strategy }}

            Status: SUCCESS
          format: MARKDOWN
