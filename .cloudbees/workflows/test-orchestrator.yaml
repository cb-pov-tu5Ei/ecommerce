apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: test-orchestrator

on:
  workflow_dispatch:
    inputs:
      artifact-version:
        type: string
        required: true

      target-environment:
        type: string
        required: true

      deployment-region:
        type: string
        required: true

      enable-maintenance-mode:
        type: boolean
        required: false

      deployment-strategy:
        type: string
        required: true

jobs:
  test-stage:
    environment: ${{ inputs.target-environment }}
