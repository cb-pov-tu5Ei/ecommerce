apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: joint-deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      artifact-url:
        type: string
        required: true
      artifact-id: 
        type: string
        required: true
jobs:
  staging:
      uses: ./.cloudbees/workflows/deploy.yaml
      with:
        artifact-url: ${{ inputs.artifact-url }}
        artifact-id: ${{ inputs.artifact-id }}
        environment: staging
      secrets: inherit
      vars: inherit
  production:
      uses: ./.cloudbees/workflows/deploy.yaml
      with:
        artifact-url: ${{ inputs.artifact-url }}
        artifact-id: ${{ inputs.artifact-id }}
        environment: production
      secrets: inherit
      vars: inherit
