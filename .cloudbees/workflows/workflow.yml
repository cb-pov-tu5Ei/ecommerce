apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow

name: ecommerce-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    env:
      SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}

    steps:
      - name: Checkout code
        uses: cloudbees-io/checkout@v1
        with:
          fetch-depth: 0

      - name: Verify Smart Tests connectivity
        uses: docker://cloudbeesdemo/maven-st:v1
        run: |
          smart-tests verify || true

      - name: Record build with Smart Tests
        uses: docker://cloudbeesdemo/maven-st:v1
        run: |
          smart-tests record build --build ${{ cloudbees.run_id }}

      - name: Record session with Smart Tests
        uses: docker://cloudbeesdemo/maven-st:v1
        run: |
          smart-tests record session --build ${{ cloudbees.run_id }} --test-suite maven-unit-integration-tests > session.txt
          cat session.txt

      - name: Compile tests
        uses: docker://maven:3.9-eclipse-temurin-17
        run: |
          mvn test-compile

      - name: Create Smart Tests subset
        uses: docker://cloudbeesdemo/maven-st:v1
        run: |
          find . -path '*/target/maven-status/maven-compiler-plugin/testCompile/default-testCompile/createdFiles.lst' -exec cat {} \; | \
            grep -v "selenium" | \
            grep -v "TestDelayUtil" | \
            grep -v "TestSecurityConfig" | \
            grep "Test\.class$\|Tests\.class$" > filtered-tests.lst
          smart-tests subset maven --session @session.txt --confidence 80% --test-compile-created-file filtered-tests.lst > smart-tests-subset.txt
          cat smart-tests-subset.txt

      - name: Run tests
        uses: docker://maven:3.9-eclipse-temurin-17
        kind: test
        run: |
          mvn test -Dsurefire.includesFile=$PWD/smart-tests-subset.txt

      - name: Record test results with Smart Tests
        uses: docker://cloudbeesdemo/maven-st:v1
        if: ${{always()}}
        run: |
          smart-tests record tests maven --session @session.txt "**/target/surefire-reports"

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        if: ${{always()}}
        with:
          test-type: JUNIT
          results-path: ${{ cloudbees.workspace }}/target/surefire-reports

      - name: Build package
        id: build
        uses: docker://maven:3.9-eclipse-temurin-17
        run: |
          mvn package -DskipTests
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "$VERSION" > $CLOUDBEES_OUTPUTS/VERSION
          echo "$ARTIFACT_ID" > $CLOUDBEES_OUTPUTS/ARTIFACT_ID

      - name: Register build artifact
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: "${{ steps.build.outputs.ARTIFACT_ID }}"
          url: "file://target/${{ steps.build.outputs.ARTIFACT_ID }}-${{ steps.build.outputs.VERSION }}.jar"
          version: "${{ steps.build.outputs.VERSION }}"
          type: "maven"
