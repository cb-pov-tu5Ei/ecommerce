apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy
on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      artifact-url:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: cloudbees-io/checkout@v1

      - name: Run Ansible deployment
        id: deploy
        uses: docker://python:3.11-slim
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # Install Ansible and dependencies
          apt-get update && apt-get install -y sshpass openssh-client
          pip install ansible

          # Map environment to VM IP
          if [ "${{ inputs.environment }}" = "staging" ]; then
            VM_IP="${{ vars.STAGING_VM_IP }}"
          else
            VM_IP="${{ vars.PRODUCTION_VM_IP }}"
          fi

          echo "Deploying to: $VM_IP"
          echo "Artifact: ${{ inputs.artifact-url }}"

          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Run Ansible playbook
          cd ansible
          ansible-playbook -i "${VM_IP}," deploy.yml \
            -e "ansible_user=ansible" \
            -e "ansible_ssh_private_key_file=~/.ssh/id_rsa" \
            -e "artifactory_user=${{ secrets.ARTIFACTORY_USER }}" \
            -e "artifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}" \
            -e "deploy_environment=${{ inputs.environment }}" \
            -e "artifact_url=${{ inputs.artifact-url }}"

          # Save VM IP for evidence
          echo "$VM_IP" > $CLOUDBEES_OUTPUTS/vm_ip

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ inputs.artifact-id }}

      - name: Publish evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Deployed to ${{ inputs.environment }}

            **Application URL**: [http://${{ steps.deploy.outputs.vm_ip }}:8080/](http://${{ steps.deploy.outputs.vm_ip }}:8080/)

            **Artifact**: ${{ inputs.artifact-url }}

            **Environment**: ${{ inputs.environment }}

            **VM IP**: ${{ steps.deploy.outputs.vm_ip }}

            **Deployment Time**: ${{ cloudbees.run_id }}
          format: MARKDOWN
