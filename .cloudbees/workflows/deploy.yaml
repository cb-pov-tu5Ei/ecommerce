apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy
on:
  workflow_dispatch:
    inputs:
      artifact-id:
        type: string
        required: true
      artifact-url:
        type: string
        required: true
      environment:
        type: string
        required: true
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      artifact-url:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: Get current deployment version
        id: current-version
        uses: https://github.com/cb-demos/current-env-inventory
        with:
          organization-id: 51ee5c7b-c124-48ca-be09-b6f8297ddca2
          environment-name: ${{ inputs.environment }}
          artifact-name: ecommerce
          api-token: ${{ secrets.UNIFY_PAT }}
      - name: Checkout repository
        uses: cloudbees-io/checkout@v2
        with:
          repository: https://github.com/cb-pov-tu5Ei/ecommerce
      - name: run ansible playbook
        uses: https://github.com/cb-pov-tu5Ei/ecommerce/.cloudbees/actions/run-ansible
        with:
          artifact-url: ${{ inputs.artifact-url }}
          artifact-id: ${{ inputs.artifact-id }}
          environment: ${{ inputs.environment }}
      - name: rollback to previous version
        if: ${{ failure() }}
        uses: https://github.com/cb-pov-tu5Ei/ecommerce/.cloudbees/actions/run-ansible
        with:
          artifact-url: ${{ steps.current-version.outputs.artifact-url }}
          artifact-id: ${{ steps.current-version.outputs.artifact-id }}
          environment: ${{ inputs.environment }}
