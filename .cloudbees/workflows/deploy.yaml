apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy
on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      artifact-url:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: cloudbees-io/checkout@v1

      - name: Prepare deployment
        id: prepare
        uses: docker://python:3.11-slim
        run: |
          # Extract JAR filename from URL
          JAR_FILENAME=$(echo "${{ inputs.artifact-url }}" | grep -o '[^/]*\.jar$')
          JAR_PATH=$(echo "${{ inputs.artifact-url }}" | sed 's|https://artifactory.tjx-poc.cb-demos.io/artifactory/libs-snapshot/||')

          # Map environment to VM IP
          if [ "${{ inputs.environment }}" = "staging" ]; then
            VM_IP="${{ vars.STAGING_VM_IP }}"
          else
            VM_IP="${{ vars.PRODUCTION_VM_IP }}"
          fi

          echo "JAR Filename: $JAR_FILENAME"
          echo "JAR Path: $JAR_PATH"
          echo "VM IP: $VM_IP"

          # Save to outputs
          echo "$JAR_FILENAME" > $CLOUDBEES_OUTPUTS/jar_filename
          echo "$JAR_PATH" > $CLOUDBEES_OUTPUTS/jar_path
          echo "$VM_IP" > $CLOUDBEES_OUTPUTS/vm_ip

      - name: Setup Ansible
        uses: docker://python:3.11-slim
        run: |
          apt-get update && apt-get install -y sshpass openssh-client
          pip install ansible

      - name: Setup SSH key
        uses: docker://python:3.11-slim
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ steps.prepare.outputs.vm_ip }} >> ~/.ssh/known_hosts || true

      - name: Run Ansible deployment
        uses: docker://python:3.11-slim
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # Install Ansible
          apt-get update && apt-get install -y sshpass openssh-client
          pip install ansible

          # Setup SSH key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Run Ansible playbook
          cd ansible
          ansible-playbook -i "${{ steps.prepare.outputs.vm_ip }}," deploy.yml \
            -e "ansible_user=ansible" \
            -e "ansible_ssh_private_key_file=~/.ssh/id_rsa" \
            -e "artifactory_user=${{ secrets.ARTIFACTORY_USER }}" \
            -e "artifactory_password=${{ secrets.ARTIFACTORY_PASSWORD }}" \
            -e "deploy_environment=${{ inputs.environment }}" \
            -e "jar_filename=${{ steps.prepare.outputs.jar_filename }}" \
            -e "artifactory_jar_path=${{ steps.prepare.outputs.jar_path }}"

      - name: Register deployed artifact
        uses: cloudbees-io/register-deployed-artifact@v2
        with:
          artifact-id: ${{ inputs.artifact-id }}

      - name: Publish evidence
        uses: cloudbees-io/publish-evidence-item@v1
        with:
          content: |-
            ## Deployed to ${{ inputs.environment }}

            **Application URL**: [http://${{ steps.prepare.outputs.vm_ip }}:8080/](http://${{ steps.prepare.outputs.vm_ip }}:8080/)

            **Artifact**: ${{ inputs.artifact-url }}

            **Environment**: ${{ inputs.environment }}

            **VM IP**: ${{ steps.prepare.outputs.vm_ip }}

            **Deployment Time**: ${{ cloudbees.run_id }}
          format: MARKDOWN
